name: Publish FatLine v0.2.0-beta.1

on:
  push:
    branches: [ main ]
    paths:
      - 'releases/v0.2.0-beta.1.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Prepare stable test signing key
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/fatline-ci-debug.p12"
          base64 --decode tools/fatline-ci-debug.p12.b64 > "$KEYSTORE"
          echo "FATLINE_CI_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "FATLINE_CI_KEYSTORE_PASSWORD=fatline-ci-debug" >> "$GITHUB_ENV"
          echo "FATLINE_CI_KEY_ALIAS=fatline-ci-debug" >> "$GITHUB_ENV"
          echo "FATLINE_CI_KEY_PASSWORD=fatline-ci-debug" >> "$GITHUB_ENV"
          keytool -list -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass fatline-ci-debug -alias fatline-ci-debug >/dev/null
      - name: Validate and build APK
        shell: bash
        run: |
          python3 tools/validate_project.py
          gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace
      - name: Verify APK signature
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/apk-certs.txt"
          grep -Fqi "f032d1d5659ff4a10756e0518a29c2f61462ede84a86e87571517f740c704763" "$RUNNER_TEMP/apk-certs.txt"
      - name: Publish GitHub prerelease with installable APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.2.0-beta.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; not overwriting it."
            exit 0
          fi
          APK="FatLine-v0.2.0-beta.1-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK"
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "FatLine v0.2.0 beta 1" \
            --notes-file releases/v0.2.0-beta.1.md \
            --prerelease
          gh release view "$TAG" --json url,tagName,assets
